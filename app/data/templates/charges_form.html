<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Charges de copropriété - Stats</title>
    <style>
      body { font-family: sans-serif; max-width: 720px; margin: 40px auto; }
      label { display:block; margin-top:12px; }
      input { width: 100%; padding: 8px; }
      button { margin-top: 12px; padding: 10px 14px; }
      pre { background:#f6f6f6; padding:12px; border-radius:8px; }
      small { color:#555; }
    </style>
  </head>
  <body>
    <h1>Stats charges de copropriété</h1>
    <small>Renseignez un département OU une ville OU un code postal.</small>

    <form id="form">
      <label>Département (ex: 75)
        <input name="department_code" />
      </label>

      <label>Ville (ex: Vincennes)
        <input name="city" />
      </label>

      <label>Code postal (ex: 94300)
        <input name="postal_code" />
      </label>

      <button type="submit">Calculer</button>
    </form>

    <h2>Résultat</h2>
    <pre id="out">{}</pre>

    <hr />

    <h2>Importer une annonce Bienici</h2>

    <form id="import-form">
    <label>URL Bienici
        <input name="url" placeholder="https://www.bienici.com/annonce/..." />
    </label>
    <button type="submit">Importer</button>
    </form>

    <h3>Résultat import</h3>
    <pre id="import-out">{}</pre>

    <script>
    // Stats
    const form = document.getElementById("form");
    const out = document.getElementById("out");

    const dept = form.querySelector('input[name="department_code"]');
    const city = form.querySelector('input[name="city"]');
    const postal = form.querySelector('input[name="postal_code"]');
    const inputs = [dept, city, postal];

    function syncExclusive(active) {
        if (active.value.trim() !== "") {
        for (const inp of inputs) {
            if (inp !== active) {
            inp.value = "";
            inp.disabled = true;
            } else {
            inp.disabled = false;
            }
        }
        } else {
        const still = inputs.find((i) => i.value.trim() !== "");
        if (still) {
            syncExclusive(still);
        } else {
            for (const inp of inputs) inp.disabled = false;
        }
        }
    }

    for (const inp of inputs) {
        inp.addEventListener("input", () => syncExclusive(inp));
    }

    form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const fd = new FormData(form);
        const params = new URLSearchParams();
        for (const [k, v] of fd.entries()) {
        if (String(v).trim() !== "") params.set(k, v);
        }

        const url = "/api/stats/charges/?" + params.toString();
        const res = await fetch(url);
        const data = await res.json();

        out.textContent = JSON.stringify(data, null, 2);

        // Reset form after submit
        form.reset();
        for (const inp of inputs) {
        inp.disabled = false;
        }
    });

    // Import
    const importForm = document.getElementById("import-form");
    const importOut = document.getElementById("import-out");

    importForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const fd = new FormData(importForm);
        const url = fd.get("url");

        const res = await fetch("/api/listings/import-bienici/", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({ url }),
        });

        const data = await res.json();
        importOut.textContent = JSON.stringify(data, null, 2);
    });
    </script>
  </body>
</html>
